app_id: ARankB
args:
  alg_list:
    # alg_id can be RandomSampling or InfoTuple. 
    # name your own alg_lable and test_alg_label
    # add as many entries as you like.
    - {alg_id: InfoTuple, alg_label: InfoTuple, test_alg_label: Test}
  algorithm_management_settings:
    mode: fixed_proportions
    params:
    # You can mix in RandomSampling here and adjust the proportion so they add up to 1.
    # - {alg_label: RandomSampling, proportion: 0.5}
    # - {alg_label: InfoTuple, proportion: 0.5}
    - {alg_label: InfoTuple, proportion: 1}
  d: 3 # embedding dimension
  A: 3 # how many targets in total
  B: 3 # how many targets among all that a participant needs to rank
  random_seed: 12 # 
  num_tries: 15 # Will be 25 be default if this field is missing. Make sure this value equals to (burn_in + iteration) * A 
  #----------------------------InfoTuple Exclusive------------------------#
  failure_probability: 0.01
  iteration: 1 # each cycle of normal iteration involves every target being the head once
  burn_in: 1 # each cycle of burn-in iteration involves every target being the head once
  down_sample: 0.1
  mu: 0.05 
  debug: false # please set to true at the moment
  #-----------------------------For Trap Questions------------------------------------#
  setTrap: false # whether to set trap questions
  expel: true # whether to expel participants immediately if exceeds tolerance
  tolerance: 0.3 # tolerance for the trap question
  # the portion of normal questions to answer before a trap shows up 
  # if set to 0.0 all available trap questions will be evenly spaced out and asked 
  trapRatio: 0.0
  num_trap_questions: 0 # number of trap questions available
  #-----------------------------------------------------------------------#
  # text to display at the end if participant successfully answered all questions
  debrief: Thank you - you have completed the study. Click the link to return to Prolific and register your completion.
  # text to display at the end if participant failed
  debrief_fail: You did not pass enough attention checks, so the study ends here. Click the link to return to Prolific.
  # link to display at the end if participant successfully answered all questions
  debrief_link: https://app.prolific.com/submissions/complete?cc=YOUR_SUCCESS_CODE # set your study's completion code before launching
  # link to display at the end if participant failed
  debrief_link_fail: https://app.prolific.com/submissions/complete?cc=YOUR_FAILURE_CODE # set your study's completion code before launching
  # Server-error handling (see next/query_page/templates/query_page.html)
  retry_attempts: 3 # automatic retries of a failed server call before the technical-problem exit
  debrief_error: A technical problem interrupted the study and it cannot continue right now. Your progress has been saved. Click the link to return to Prolific, then message the researcher quoting your participant ID.
  debrief_link_error: https://app.prolific.com/submissions/complete?cc=YOUR_TECHNICAL_CODE # a third Prolific completion code meaning 'technical issue' - keep it distinct from the fail code
  #-----------------------------------------------------------------------#
  # This is a generic instructions for the query page. To change other instructions, 
  # please look for div elements with class name "xxx-text" in the html file at 
  # apps/ARankB/widgets/getQuery_widget.html
  instructions: ""
  participant_to_algorithm_management: one_to_many
  targets:
     # Allocate your resource locally and fill in the primary_description field with directory to each resource. 
     # e.g. 'http://44.223.248.38/media/video01.mp4' make sure to change the primary_type field accordingly
     # and use the correct Instance IP
     # The trap questions should come after the normal questions within this set and its number should match the num_trap_questions field
    targetset:
    - {primary_description: 'Computer Science', alt_description: '', primary_type: 'text', alt_type: ''}
    - {primary_description: 'Artificial Intelligence', alt_description: '', primary_type: 'text', alt_type: ''}
    - {primary_description: 'Mathematics', alt_description: '', primary_type: 'text', alt_type: ''}
    - {primary_description: 'Psychology', alt_description: '', primary_type: 'text', alt_type: ''}
    - {primary_description: 'Social Science', alt_description: '', primary_type: 'text', alt_type: ''}
    - {primary_description: 'Biology', alt_description: '', primary_type: 'text', alt_type: ''}



    #--------------Resource after A number of targets are dedicated to trap questions------------------------------------#
    # Primary description is the answers, alt_description is the question. The first option is the correct answer.
    # - {primary_description: 'Positive, Negativity, War, Peace', alt_description: 'Choose the option with the word positive in it.', primary_type: 'text', alt_type: ''}
    # - {primary_description: 'Running, sleeping, cleaning, eating', alt_description: 'Pick the option with no e in it.', primary_type: 'text', alt_type: ''}
    # - {primary_description: 'yes, cleaning, running', alt_description: 'Are you paying attention?', primary_type: 'text', alt_type: ''}
    # - {primary_description: 'running and sleeping, sleeping a lot today, running', alt_description: 'Pick the option with three words?', primary_type: 'text', alt_type: ''}
