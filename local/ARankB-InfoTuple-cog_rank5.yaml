app_id: ARankB
args:
  alg_list:
    # alg_id can be RandomSampling or InfoTuple. 
    # name your own alg_lable and test_alg_label
    # add as many entries as you like.
    - {alg_id: InfoTuple, alg_label: InfoTuple, test_alg_label: Test}
  algorithm_management_settings:
    mode: fixed_proportions
    params:
    # You can mix in RandomSampling here and adjust the proportion so they add up to 1.
    # - {alg_label: RandomSampling, proportion: 0.5}
    # - {alg_label: InfoTuple, proportion: 0.5}
    - {alg_label: InfoTuple, proportion: 1}
  d: 3 # embedding dimension
  A: 5 # how many targets in total
  B: 5 # how many targets among all that a participant needs to rank
  random_seed: 12 # 
  num_tries: 100 # Will be 25 be default if this field is missing. Make sure this value equals to (burn_in + iteration) * A 
  #----------------------------InfoTuple Exclusive------------------------#
  failure_probability: 0.01
  iteration: 3 # each cycle of normal iteration involves every target being the head once
  burn_in: 1 # each cycle of burn-in iteration involves every target being the head once
  down_sample: 0.05 
  mu: 0.05 
  debug: false # please set to true at the moment
  #-----------------------------For Trap Questions------------------------------------#
  setTrap: true # whether to set trap questions
  expel: true # whether to expel participants immediately if exceeds tolerance
  tolerance: 0.3 # tolerance for the trap question
  # the portion of normal questions to answer before a trap shows up 
  # if set to 0.0 all available trap questions will be evenly spaced out and asked 
  trapRatio: 0.0
  num_trap_questions: 4 # number of trap questions available
  #-----------------------------------------------------------------------#
  # text to display at the end if participant successfully answered all questions
  debrief: Click the link to finish
  # text to display at the end if participant failed
  debrief_fail: Click the link to finish
  # link to display at the end if participant successfully answered all questions
  debrief_link: https://vivek2000anand.github.io/success_effort.io/
  # link to display at the end if participant failed
  debrief_link_fail: https://vivek2000anand.github.io/effort_failure.io/ 
  #-----------------------------------------------------------------------#
  # This is a generic instructions for the query page. To change other instructions, 
  # please look for div elements with class name "xxx-text" in the html file at 
  # apps/ARankB/widgets/getQuery_widget.html
  instructions: ""
  participant_to_algorithm_management: one_to_many
  targets:
     # Allocate your resource locally and fill in the primary_description field with directory to each resource. 
     # e.g. 'http://44.223.248.38/media/video01.mp4' make sure to change the primary_type field accordingly
     # and use the correct Instance IP
     # The trap questions should come after the normal questions within this set and its number should match the num_trap_questions field
    targetset:
    - {primary_description: 'Eating a meal.', alt_description: '', primary_type: 'text', alt_type: ''}
    - {primary_description: 'Going on a walk.', alt_description: '', primary_type: 'text', alt_type: ''}
    - {primary_description: 'Catching up with old friends.', alt_description: '', primary_type: 'text', alt_type: ''}
    - {primary_description: 'Scrubbing the dirty bathroom.', alt_description: '', primary_type: 'text', alt_type: ''}
    - {primary_description: 'Taking an exam.', alt_description: '', primary_type: 'text', alt_type: ''}
    - {primary_description: 'Participating in a meeting.', alt_description: '', primary_type: 'text', alt_type: ''}
    - {primary_description: 'Swimming in the pool.', alt_description: '', primary_type: 'text', alt_type: ''}
    - {primary_description: 'Painting a beautiful landscape.', alt_description: '', primary_type: 'text', alt_type: ''}
    - {primary_description: 'Hiking in the mountains.', alt_description: '', primary_type: 'text', alt_type: ''}
