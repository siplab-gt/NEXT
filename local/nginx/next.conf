upstream backend {
    server nextbackenddocker:8000;
}

upstream cadvisor {
    server cadvisor:8080;
}

# The whole local/nginx/ folder is mounted (read-only) as the container's
# /etc/nginx/conf.d/, so any edit here is visible inside the container - unlike the
# old single-file mount, which kept showing the old file after an editor replaced
# it - and the image's stock default.conf ("Welcome to nginx", which answered every
# hostname except the IP) is gone. nginx loads conf.d/*.conf; the snippets/*.inc
# files are only used through include:
#   snippets/common.inc         gzip, upload size, /media/
#   snippets/proxy_backend.inc  proxy to the backend with the 330 s timeouts
# Apply changes: docker exec reverse_proxy nginx -t && docker exec reverse_proxy nginx -s reload

# ---- port 80 -----------------------------------------------------------------
server {
  listen  80 default_server;
  server_name siplab-next.xyz www.siplab-next.xyz 52.2.236.217;

  include /etc/nginx/conf.d/snippets/common.inc;

  # Let's Encrypt HTTP-01 challenge (certbot --webroot -w /var/www/certbot)
  location ^~ /.well-known/acme-challenge/ {
    root /var/www/certbot;
    default_type text/plain;
  }

  location / {
    include /etc/nginx/conf.d/snippets/proxy_backend.inc;
  }

  location /cadvisor/ {
    proxy_pass http://cadvisor/;
    proxy_redirect ~^/containers/ /cadvisor/containers/;
    proxy_redirect ~^/docker/ /cadvisor/docker/;
    proxy_set_header    Host                $http_host;
    proxy_set_header    X-Real-IP           $remote_addr;
    proxy_set_header    X-Forwarded-For     $proxy_add_x_forwarded_for;
    proxy_set_header    X-Forwarded-Proto   $scheme;
  }
}
