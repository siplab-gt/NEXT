upstream backend {
    server nextbackenddocker:8000;
}

upstream cadvisor {
    server cadvisor:8080;
}

# The whole local/nginx/ folder is mounted (read-only) as the container's
# /etc/nginx/conf.d/, so any edit here is visible inside the container - unlike the
# old single-file mount, which kept showing the old file after an editor replaced
# it - and the image's stock default.conf ("Welcome to nginx", which answered every
# hostname except the IP) is gone. nginx loads conf.d/*.conf; the snippets/*.inc
# files are only used through include:
#   snippets/common.inc         gzip, upload size, /media/
#   snippets/proxy_backend.inc  proxy to the backend with the 330 s timeouts
# Apply changes: docker exec reverse_proxy nginx -t && docker exec reverse_proxy nginx -s reload

# ---- port 80 -----------------------------------------------------------------
server {
  listen  80 default_server;
  server_name siplab-next.xyz www.siplab-next.xyz 52.2.236.217;

  include /etc/nginx/conf.d/snippets/common.inc;

  # Let's Encrypt HTTP-01 challenge (certbot --webroot -w /var/www/certbot)
  location ^~ /.well-known/acme-challenge/ {
    root /var/www/certbot;
    default_type text/plain;
  }

  # participant paths: served over plain HTTP too (experiments with protocol: http)
  include /etc/nginx/conf.d/snippets/participant.inc;

  # everything else is admin: never over HTTP - send it to HTTPS, where the
  # password applies. Per path only; no global redirect and no HSTS
  # (HTTPS_PLAN.md: "Choosing HTTP or HTTPS per experiment").
  location / {
    return 301 https://siplab-next.xyz$request_uri;
  }
}

# ---- port 443 ----------------------------------------------------------------
# Certificate from Let's Encrypt (certbot on the host, renewed by certbot.timer,
# nginx reloaded by local/certbot-deploy-hook.sh). Never add an HSTS header: it
# would make browsers refuse HTTP on this name for months, breaking protocol: http
# experiments linked through it.
server {
  listen 443 ssl default_server;
  http2 on;
  server_name siplab-next.xyz www.siplab-next.xyz;

  ssl_certificate     /etc/letsencrypt/live/siplab-next.xyz/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/siplab-next.xyz/privkey.pem;
  ssl_protocols       TLSv1.2 TLSv1.3;
  ssl_session_cache   shared:SSL:10m;
  ssl_session_timeout 1d;

  include /etc/nginx/conf.d/snippets/common.inc;
  include /etc/nginx/conf.d/snippets/participant.inc;

  # the app has no page at "/" (it answers "Resource not found"): send the bare
  # address to the experiment list (which asks for the password)
  location = / {
    return 302 /dashboard/experiment_list;
  }

  # admin: dashboard, data downloads, logs, experiment creation, ...
  location / {
    include /etc/nginx/conf.d/snippets/admin.inc;
    include /etc/nginx/conf.d/snippets/proxy_backend.inc;
  }

  location /cadvisor/ {
    include /etc/nginx/conf.d/snippets/admin.inc;
    proxy_pass http://cadvisor/;
    proxy_redirect ~^/containers/ /cadvisor/containers/;
    proxy_redirect ~^/docker/ /cadvisor/docker/;
    proxy_set_header    Host                $http_host;
    proxy_set_header    X-Real-IP           $remote_addr;
    proxy_set_header    X-Forwarded-For     $proxy_add_x_forwarded_for;
    proxy_set_header    X-Forwarded-Proto   $scheme;
  }
}
